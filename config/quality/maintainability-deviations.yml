# TramAI 0.6.0 — Maintainability Deviation Tracking
#
# Every accepted deviation from the maintainability baseline must be recorded here.
# Deviations carry: a unique ID, metric, scope, baseline value, allowed value,
# reason, acceptance date, target phase for resolution, and owner.
#
# Format:
#   - id: MQ-XXXX (maintainability quality deviation)
#     metric: <metric name>
#     scope: <module, file, or declaration>
#     baseline: <measured value at 0.5.0>
#     allowed: <tolerated maximum or minimum>
#     reason: <justification for accepting this deviation>
#     acceptedAt: <ISO-8601 date>
#     targetPhase: <0.6.x phase when this should be addressed>
#     owner: <GitHub handle or team>


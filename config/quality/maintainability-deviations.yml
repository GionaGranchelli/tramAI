# TramAI 0.6.0 — Maintainability Deviation Tracking
#
# Every accepted deviation from the maintainability baseline must be recorded here.
# Deviations carry: a unique ID, metric, scope, baseline value, allowed value,
# reason, acceptance date, target phase for resolution, and owner.
#
# Format:
#   - id: MQ-XXXX (maintainability quality deviation)
#     metric: <metric name>
#     scope: <module, file, or declaration>
#     baseline: <measured value at 0.5.0>
#     allowed: <tolerated maximum or minimum>
#     reason: <justification for accepting this deviation>
#     acceptedAt: <ISO-8601 date>
#     targetPhase: <0.6.x phase when this should be addressed>
#     owner: <GitHub handle or team>

deviations:
  - id: MQ-0001
    metric: constructorParameterCount
    scope: ":tramai-engine"
    baseline: 32
    allowed: 32
    reason: "Engine proxy dispatch centralizes many concerns (provider resolution, tool routing, structured output, retry). Decomposition is planned for Phase 1 (engine decomposition epic)."
    acceptedAt: "2026-07-18"
    targetPhase: "0.6.1"
    owner: "GionaGranchelli"

  - id: MQ-0002
    metric: fileSize
    scope: "::build.gradle.kts"
    baseline: 5501
    allowed: 6500
    reason: "Root build script accumulated publish, signing, and verification logic. Build-logic extraction is underway in Phase 0 and will continue through 0.6.x."
    acceptedAt: "2026-07-18"
    targetPhase: "0.6.2"
    owner: "GionaGranchelli"

  - id: MQ-0003
    metric: fileSize
    scope: ":tramai-orchestration"
    baseline: 1858
    allowed: 1858
    reason: "Workflow orchestration is a known monolith combining metadata, execution, persistence, DSL, and observers. Decomposition is a major 0.6.0 goal (Phase 4)."
    acceptedAt: "2026-07-18"
    targetPhase: "0.6.1"
    owner: "GionaGranchelli"

  - id: MQ-0004
    metric: globalMutableState
    scope: ":tramai-core"
    baseline: 3
    allowed: 3
    reason: "Provider registration is inherently global. Migration to injectable registry planned for 0.7.0."
    acceptedAt: "2026-07-18"
    targetPhase: "0.7.0"
    owner: "GionaGranchelli"

  - id: MQ-0005
    metric: cancellationCriticalCount
    scope: ":tramai-*"
    baseline: 65
    allowed: 72
    reason: "Broad exception catches in suspend-capable execution paths. Cancellation rethrow audit and cleanup is part of Phase 1 correctness hotfixes."
    acceptedAt: "2026-07-19"
    targetPhase: "0.6.1"
    owner: "GionaGranchelli"

# Verification policy:
# - New findings that match an existing deviation (same metric + scope) are allowed.
# - New findings with no matching deviation cause verify tasks to fail.
# - Deviations with a past targetPhase cause verify tasks to warn.

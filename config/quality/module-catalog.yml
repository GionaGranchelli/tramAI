schemaVersion: "2"
description: "TramAI 0.6.0 authoritative module catalogue. Every Gradle project appears exactly once."

dependencyPolicies:
  core: { allowedLayers: [core-contracts, testing-support] }
  runtime: { allowedLayers: [core-contracts, runtime-execution, governance-security, testing-support] }
  provider-adapter: { allowedLayers: [core-contracts, runtime-execution, provider-adapters, testing-support] }
  framework: { allowedLayers: [core-contracts, runtime-execution, governance-security, persistence, provider-adapters, framework-integrations, operations-observability, higher-capabilities, testing-support] }
  testing: { allowedLayers: [core-contracts, framework-integrations, testing-support] }
  example: { allowedLayers: [core-contracts, runtime-execution, governance-security, persistence, provider-adapters, framework-integrations, operations-observability, higher-capabilities, applications-examples, testing-support] }
  bom: { allowedLayers: [core-contracts, runtime-execution, governance-security, persistence, provider-adapters, framework-integrations, operations-observability, higher-capabilities, applications-examples, testing-support] }

# YAML merges keep each entry complete while making the shared module classifications auditable.
entryDefaults:
  example: &example { maturity: internal, visibility: internal, owner: examples, dependencyPolicy: example, releaseInclusion: excluded, rationale: "Provides an executable example for the documented TramAI capability." }
  provider: &provider { maturity: preview, visibility: public, owner: providers, dependencyPolicy: provider-adapter, releaseInclusion: included, rationale: "Provides a provider-specific TramAI adapter." }
  core: &core { maturity: stable, visibility: public, owner: core, dependencyPolicy: core, releaseInclusion: included, rationale: "Provides a stable core TramAI contract." }
  bom: &bom { maturity: stable, visibility: public, owner: core, dependencyPolicy: bom, releaseInclusion: included, rationale: "Provides the published TramAI dependency alignment platform." }
  runtime: &runtime { maturity: preview, visibility: public, owner: runtime, dependencyPolicy: runtime, releaseInclusion: included, rationale: "Provides a runtime execution capability for TramAI." }
  framework: &framework { maturity: preview, visibility: public, owner: framework, dependencyPolicy: framework, releaseInclusion: included, rationale: "Provides a framework integration for TramAI." }
  capability: &capability { maturity: preview, visibility: public, owner: capabilities, dependencyPolicy: framework, releaseInclusion: included, rationale: "Provides a higher-level TramAI capability." }
  security: &security { maturity: preview, visibility: public, owner: security, dependencyPolicy: framework, releaseInclusion: included, rationale: "Provides a governance or security capability for TramAI." }
  persistence: &persistence { maturity: preview, visibility: public, owner: persistence, dependencyPolicy: framework, releaseInclusion: included, rationale: "Provides a persistence capability for TramAI." }
  operations: &operations { maturity: preview, visibility: public, owner: observability, dependencyPolicy: framework, releaseInclusion: included, rationale: "Provides an operations or observability capability for TramAI." }
  internal: &internal { maturity: internal, visibility: internal, owner: runtime, dependencyPolicy: framework, releaseInclusion: internal_only, rationale: "Provides an internal supporting capability for TramAI." }
  internalTesting: &internalTesting { maturity: internal, visibility: internal, owner: testing, dependencyPolicy: testing, releaseInclusion: internal_only, rationale: "Provides internal testing support for TramAI." }
  publishedTesting: &publishedTesting { maturity: internal, visibility: public, owner: testing, dependencyPolicy: testing, releaseInclusion: included, rationale: "Provides published testing support for TramAI." }

modules:
  - path: ":examples:approval-resume"
    <<: *example
    layer: applications-examples
    publishability: excluded
    apiStability: excluded

  - path: ":examples:governed-workflow"
    <<: *example
    layer: applications-examples
    publishability: excluded
    apiStability: excluded

  - path: ":examples:sovereign-document-intelligence"
    <<: *example
    layer: applications-examples
    publishability: excluded
    apiStability: excluded

  - path: ":examples:sovereign-offline-verification"
    <<: *example
    layer: applications-examples
    publishability: excluded
    apiStability: excluded

  - path: ":examples:spring-sovereign-starter"
    <<: *example
    layer: applications-examples
    publishability: excluded
    apiStability: excluded

  - path: ":examples:support-agent"
    <<: *example
    layer: applications-examples
    publishability: excluded
    apiStability: excluded

  - path: ":examples:tool-governance"
    <<: *example
    layer: applications-examples
    publishability: excluded
    apiStability: excluded

  - path: ":tramai-anthropic"
    <<: *provider
    rationale: "Provider adapter for Anthropic Claude models via the TramAI provider SPI."
    layer: provider-adapters
    publishability: published
    apiStability: preview

  - path: ":tramai-azure-openai"

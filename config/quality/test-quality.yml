schemaVersion: "1"
criticalModules:
  - ":tramai-core"
  - ":tramai-engine"
  - ":tramai-security"
  - ":tramai-sovereign"
  - ":tramai-standalone"
  - ":tramai-structured"
  - ":tramai-orchestration"
  - ":tramai-persistence-file"
  - ":tramai-persistence-jdbc"
coverage:
  regressionTolerancePercentagePoints: 1.0
  exclusions:
    - pattern: "**/model/**"
      reason: "Generated model classes"
mutation:
  regressionTolerancePercentagePoints: 1.0
  targetFamilies:
    policy:
      modules: [":tramai-security", ":tramai-sovereign"]
      targetClasses: ["dev.tramai.security.*", "dev.tramai.sovereign.*"]
    approval:
      modules: [":tramai-sovereign"]
      targetClasses: ["dev.tramai.sovereign.*"]
    routing:
      modules: [":tramai-engine"]
      targetClasses: ["dev.tramai.engine.*"]
    retry:
      modules: [":tramai-engine"]
      targetClasses: ["dev.tramai.engine.*"]
    tools:
      modules: [":tramai-engine", ":tramai-security"]
      targetClasses: ["dev.tramai.engine.tools.*", "dev.tramai.security.tools.*", "dev.tramai.engine.*"]
    evidence:
      modules: [":tramai-sovereign"]
      targetClasses: ["dev.tramai.sovereign.*"]
    structuredOutput:
      modules: [":tramai-structured"]
      targetClasses: ["dev.tramai.structured.*"]

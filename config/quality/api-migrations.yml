# TramAI API migration registry.
#
# Each entry authorizes ONE exact API transition for ONE module:
#   module        — Gradle project path
#   fromSha256    — SHA-256 of the base-branch committed dump content
#   toSha256      — SHA-256 of the current committed dump content
#   targetVersion — the TramAI release this transition targets
#   rationale     — why the API changed
#   migration     — what downstream consumers must do
#
# Entry lifecycle (ACTIVE / LANDED):
#   ACTIVE — base hash == fromSha256 AND current hash == toSha256 AND
#            targetVersion == current project version → authorizes THIS
#            exact transition.
#   LANDED — the entry's toSha256 has landed: it is now the base and/or
#            current dump hash. Valid retained history; authorizes nothing;
#            targetVersion stays the historical release that shipped it
#            (it may differ from the current project version).
#   anything else — orphan / stale / wrong hash / wrong version → FAIL.
#
# Enforcement (all FAIL unless the entry is ACTIVE or LANDED):
#   - preview/experimental module dump changed without an ACTIVE entry   → FAIL
#   - duplicate (module, fromSha256, toSha256) entries                   → FAIL
#   - entry whose hashes match no actual module transition (orphan)      → FAIL
#   - entry hashes mismatch the real base/current dumps (stale/wrong)    → FAIL
#   - ACTIVE-candidate entry.targetVersion != project version            → FAIL
#   - stable modules can NEVER use entries (stable is frozen)            → FAIL
#
# Entries are committed in the same PR as the dump change. After merge they
# become LANDED retained history; a further dump change requires a NEW ACTIVE
# entry for the new transition (the old LANDED entry stays as history).

migrations:

    rationale: "Epic 0.7.2 classification/trust-zone resolution boundary: tramai-security gains the workload governance resolution surface (WorkloadClassificationSignal, WorkloadGovernanceResolver, WorkloadGovernanceResolution, WorkloadGovernanceFailure), and tramai-core publishes the DataClassification/ClassificationSource ranking that moved out of tramai-engine so both modules agree on one ordering. Both changes are additive."

    rationale: "Epic 0.7.2d provider-input release boundary: tramai-security gains ProviderInputRelease, which releases a specific provider-bound input only when the trust-zone decision allows it AND the classification's routing rule permits that zone. Additive only."
    migration: "No consumer action required: the release boundary is new, and no existing signature changed."

  - module: ":tramai-security"
    fromSha256: "d271ae2c1de783fb4dafac56392ddfb6d9a8ec08d608ae2ec642ef5a0a6aa0da"

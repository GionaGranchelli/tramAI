    targetVersion: "0.7.0"
    rationale: "Epic 0.7.2e restrictive effective-policy composition: tramai-security gains effectiveRoutingRules, which composes organization, environment and workload routing policy by intersection, so a narrower scope may restrict authority but never widen it. Additive only."
    migration: "No consumer action required: the composition function is new, and no existing signature changed."

  - module: ":tramai-security"
    fromSha256: "9d64fe4b905350b96eadbf505b63810fd8939e8115fbb9f11fa62c565dc990f9"
    toSha256: "61aba8fd0d35bcf250157565a6c960205af865fa2ca64d1b35794b3e4b97fe28"
    targetVersion: "0.7.0"
    rationale: "Epic 0.7.3c authorized-set derivation: tramai-security gains ProviderCandidate and CandidateAuthorization, which decide whether a provider/model candidate belongs to the authorized set by requiring every required restriction to permit it - the candidate's identity agrees with its deployment, the trust-zone policy allows the workload-to-deployment zone pair, and the classification's routing rule permits that zone. Additive only: no existing signature was removed or changed."
    migration: "No consumer action required: the candidate type and the authorized-set boundary are new, and no existing signature changed."

  - module: ":tramai-security"
    fromSha256: "61aba8fd0d35bcf250157565a6c960205af865fa2ca64d1b35794b3e4b97fe28"
    toSha256: "e3cefefc1d8389dbdff1914eb40c3d7cd417d2ab68b7c256bc7070948f879fda"
    targetVersion: "0.7.0"
    rationale: "Epic 0.7.3b candidate decision types: tramai-security replaces the Boolean authorization answer with a typed one. CandidateAuthorizationDecision is Authorized or NotAuthorized(reason), AuthorizationRefusal is the closed refusal family, and CandidateViabilityDecision plus ViabilityRefusal declare the later viability stage's vocabulary with no producer yet. ProviderInputRelease gains refusalFor, and releases() is redefined as 'no refusal' so the two views cannot disagree. CandidateAuthorization.authorizes(Boolean) is REMOVED: a Boolean answer alongside a typed one is the ambiguity this change exists to remove."
    migration: "Consumer action required only for the 0.7.3c preview API: CandidateAuthorization.authorizes() is removed in favour of decisionFor(), which returns CandidateAuthorizationDecision. Nothing in this repository consumed it. All other changes are additive."


  - module: ":tramai-security"
    fromSha256: "e3cefefc1d8389dbdff1914eb40c3d7cd417d2ab68b7c256bc7070948f879fda"
    toSha256: "bfa28c04eb2f8d7f710e6aba3abc0abd5876b49f5d40083b0b4c457288e528cc"
    targetVersion: "0.7.0"
    rationale: "Epic 0.7.3d viability after authorization: tramai-security gains CandidateViability, which applies runtime constraints only to candidates the authorization boundary has already authorized, and AuthorizedCandidates, a value whose constructor and set property are both module-internal so only code inside tramai-security can produce one or reach its contents. The evaluator argument has no default: an omitted evaluator must not be expressible, because a permissive default would mark every authorized candidate viable without consulting a runtime fact. ViabilityRefusal LOSES two members declared in 0.7.3b: HEALTH, which no producer in the repository can report, and CAPABILITY, which the epic places in authorization (authorized = policy AND classification AND trust AND capability AND registration) rather than in runtime viability."
    migration: "Consumer action required only for the 0.7.3 preview API: ViabilityRefusal.HEALTH and ViabilityRefusal.CAPABILITY are removed, and CandidateViability requires its runtime-constraint evaluator argument. Nothing in this repository consumed either member or constructed the boundary without an evaluator; both members had no producer and were referenced only by their own declaration and tests."

  - module: ":tramai-security"
    fromSha256: "bfa28c04eb2f8d7f710e6aba3abc0abd5876b49f5d40083b0b4c457288e528cc"
    toSha256: "2ea58d9d52cd93db159c473f88ead6019d80e19fad3655a0395d7a361795e612"
    targetVersion: "0.7.0"
    rationale: "Epic 0.7.3d1 authorization completeness: CandidateAuthorization now consumes registration and required capability, so authorization is the epic's full conjunction (policy AND classification AND trust AND capability AND registration) instead of the release predicate alone. It gains a ProviderRoutingPlan registration authority, and decisionFor, authorizedSet and authorizedCandidates each gain a required-capability set. AuthorizationRefusal gains PROVIDER_NOT_REGISTERED and REQUIRED_CAPABILITY_NOT_SUPPORTED, the two refusals that now have real producers. Registration is read from ProviderRoutingPlan.providers, the existing authoritative registration snapshot, and capability from ModelProvider.supportsCapability: no second registry, no capability model, and no model-name inference was introduced. ADDITIVE at the signature level: every new parameter has a default and no existing member was removed or renamed, but the JVM signatures changed, which is why this entry exists."
    migration: "Consumer action required only where the previous signatures were called positionally: decisionFor, authorizedSet and authorizedCandidates take requiredCapabilities as a trailing defaulted parameter, so existing call sites compile unchanged. A boundary constructed without a registration refuses every candidate (fail closed) - pass the routing plan whose providers are configured. An empty required-capability set adds no capability restriction and does not bypass registration."

  - module: ":tramai-security"
    fromSha256: "2ea58d9d52cd93db159c473f88ead6019d80e19fad3655a0395d7a361795e612"
    toSha256: "b3d735600a2c93883250e2d2cb7bc2e88c08512cf20f0883e3c4022c45b64991"
    targetVersion: "0.7.0"
    rationale: "Epic 0.7.3e selection/fallback fencing: tramai-security gains ViableCandidates and the selection stage. ViableCandidates is a value class whose constructor is module-internal, so only CandidateViability can mint one, and it narrows only (without(candidate) removes an attempted candidate for retry and can never add one). CandidateSelection selects zero or one candidate from such an envelope and checks the strategy's answer against it, so a caller-supplied strategy cannot widen the selection. The decision vocabulary is CandidateSelectionDecision.Selected(candidate) or NoSelection(reason) with SelectionRefusal naming exactly the three facts the boundary produces. CandidateViability.viableCandidates CHANGES ITS RETURN TYPE from Set<ProviderCandidate> to ViableCandidates: a naked set would let a caller bypass viability, which is the invariant this slice exists to enforce."
    migration: "Consumer action required for CandidateViability.viableCandidates, whose return type changed from Set<ProviderCandidate> to ViableCandidates. Read the members through ViableCandidates (isEmpty/contains/orderedBy/without) or, inside the module, its internal candidates set. Nothing outside tramai-security consumed it. The new selection types and members are additive."

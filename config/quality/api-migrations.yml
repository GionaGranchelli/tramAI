    targetVersion: "0.5.0"
    rationale: "Refresh committed API dump to match current source; pre-existing drift predating API-compatibility enforcement. No new API surface introduced by this PR."
    migration: "No consumer action required; dump refresh only."

  - module: ":tramai-spring-boot-starter-sovereign-persistence-file"

  - id: "70838f4b4cb80ac95e171be7faf0015392d5e5152b99a76a6ef0ddcf69608b2b"
    classification: "equivalent-mutant"
    reason: >-
      Resume-path NullReturn in providerTransportFailureObserved (block 29,

# TramAI 0.6.0 — Module Boundary Rules
# Forbidden architectural edges. The verifier rejects any dependency matching these patterns.
# Layers: core-contracts, runtime-execution, governance-security, persistence, provider-adapters,
#         framework-integrations, operations-observability, higher-capabilities,
#         applications-examples, testing-support
# Publishability: published, internal, excluded
schemaVersion: "1"

forbiddenEdges:
  # Core contracts must not depend on implementation layers
  # No toLayer: "*" — that would block core→core. Individual destinations below.

  - fromLayer: core-contracts
    toLayer: applications-examples
    reason: "Core contracts must not depend on example code"

  - fromLayer: core-contracts
    toLayer: runtime-execution
    reason: "Core contracts must not depend on runtime execution"

  - fromLayer: core-contracts
    toLayer: governance-security
    reason: "Core contracts must not depend on governance-security"

  - fromLayer: core-contracts
    toLayer: persistence
    reason: "Core contracts must not depend on persistence implementations"

  - fromLayer: core-contracts
    toLayer: provider-adapters
    reason: "Core contracts must not depend on specific provider implementations"

  - fromLayer: core-contracts
    toLayer: framework-integrations
    reason: "Core contracts must not depend on framework-specific integrations"

  - fromLayer: core-contracts
    toLayer: operations-observability
    reason: "Core contracts must not depend on operations/observability"

  - fromLayer: core-contracts
    toLayer: higher-capabilities
    reason: "Core contracts must not depend on higher capabilities"

  # Runtime execution must not depend on examples
  - fromLayer: runtime-execution
    toLayer: applications-examples
    reason: "Runtime execution must not depend on example code"

  # Provider adapters must not depend on application layers
  - fromLayer: provider-adapters
    toLayer: applications-examples
    reason: "Provider adapters must not depend on example code"

  - fromLayer: provider-adapters
    toLayer: operations-observability
    reason: "Provider adapters must not depend on platform/server/observability code"

  # Published modules must not depend on example/application modules
  - fromPublished: true
    toLayer: applications-examples
    reason: "Published modules must not depend on example or application code"

  # Published→excluded
  - fromPublished: true
    toPublishability: excluded
    reason: "Published modules must not depend on excluded modules"

  # Published→internal
  - fromPublished: true
    toPublishability: internal
    reason: "Published modules must not depend on internal modules (consumers can't resolve them)"

  # No self-dependencies
  - selfEdge: true
    reason: "Modules must not depend on themselves"

  # No cycles (checked separately with full cycle detection)
  # Cycle detection is handled programmatically in the verifier, not via YAML rules.

knownAllowedEdges:
  # Pre-existing published→internal edges — exact module pairs only
  - fromModule: ":tramai-platform"
    toModule: ":tramai-server"
    reason: "Platform -> Server: pre-existing baseline edge in same operations-observability layer"

  - fromModule: ":tramai-spring-boot-starter-sovereign-persistence-jdbc"
    toModule: ":tramai-persistence-jdbc"
    reason: "Sovereign persistence JDBC starter -> persistence-jdbc: pre-existing baseline edge for JDBC persistence adapter"

  # BOM inclusion references — exact module pairs only
  - fromModule: ":tramai-bom"
    toModule: ":tramai-persistence-file"
    reason: "tramai-bom includes tramai-persistence-file"


name: Sovereign Runtime Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to validate. Leave empty to use the current project default version."
        required: false
        type: string
  pull_request:
    # The RC workflow is the SINGLE sovereign-verification authority. ci.yml
    # intentionally runs no sovereign closure; keep this path list in sync
    # with the release-relevant module set.
    paths:
      - "build.gradle.kts"
      - "gradle.properties"
      - "build-logic/**"
      - "tramai-bom/**"
      - "tramai-core/**"
      - "tramai-security/**"
      - "tramai-sovereign/**"
      - "tramai-standalone/**"
      - "tramai-engine/**"
      - "tramai-structured/**"
      - "tramai-persistence-file/**"
      - "tramai-spring-sovereign/**"
      - "tramai-spring-core/**"
      - "tramai-spring-boot-starter/**"
      - "tramai-spring-boot-starter-sovereign-persistence-file/**"
      - "tramai-spring-boot-starter-sovereign-ops/**"
      - "tramai-spring-boot-starter-sovereign-ops-actuator/**"
      - "tramai-spring-boot-starter-sovereign-ops-micrometer/**"
      - "tramai-spring-boot-starter-sovereign-ops-observability/**"
      - "examples/sovereign-runtime-consumer-smoke/**"
      - "examples/sovereign-document-intelligence/**"
      - "examples/spring-sovereign-starter/**"
      - "docs/releases/**"
      - "docs/reference/releasing.md"
      - ".github/workflows/sovereign-runtime-release-candidate.yml"
      - ".github/workflows/ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRAMAI_VERSION: ${{ github.event.inputs.version || 'unresolved' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The closure aggregate pulls check -> spotless/static-analysis,
          # which auto-resolve their base against origin/master. A shallow
          # checkout has no such ref; full history is required.
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version (single source of truth)
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            RESOLVED_VERSION="$INPUT_VERSION"
          else
            RESOLVED_VERSION="$(grep '^tramaiVersion=' gradle.properties | cut -d= -f2)"
          fi
          if [[ -z "$RESOLVED_VERSION" ]]; then
            echo "::error::Could not resolve TramAI version from gradle.properties or workflow input."
            exit 1
          fi

          # Reject multiline / control-character injection before persisting
          if [[ "$RESOLVED_VERSION" == *$'\n'* || "$RESOLVED_VERSION" == *$'\r'* ]]; then
            echo "::error::Version must be a single-line value"
            exit 1
          fi

          echo "TRAMAI_VERSION=${RESOLVED_VERSION}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_tramaiVersion=${RESOLVED_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved version: ${RESOLVED_VERSION}"

      - name: Verify sovereign runtime release candidate
        timeout-minutes: 30
        # PR trigger: verifySovereignRuntimePullRequest — the sovereign-specific
        # release-chain proof WITHOUT the repository test/check graph. Mandatory
        # CI already proves tests/quality/compiler-warnings/coverage on the
        # exact commit; re-running them here duplicated the full CI stack
        # (~19-30 min measured on the P3-E profile, #372/#374, decision B).
        # workflow_dispatch (explicit release certification) keeps the full
        # independent verifySovereignRuntimeClosure with --rerun-tasks.
        run: |
          GRADLE_ARGS=(-PtramaiPublishReleaseUrl=)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            GRADLE_ARGS+=(verifySovereignRuntimeClosure --no-daemon --no-configuration-cache --rerun-tasks)
            # Epic 12.1a: deep lane activates the gated timing benchmarks
            # (-Dtramai.benchmark=true, forwarded by module test tasks). They
            # stay skipped on every pull_request run.
            GRADLE_ARGS+=(-Dtramai.benchmark=true)
          else
            GRADLE_ARGS+=(verifySovereignRuntimePullRequest --no-daemon --no-configuration-cache)
          fi
          ./gradlew "${GRADLE_ARGS[@]}"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-rc-test-reports
          path: |
            **/build/test-results/test/
            **/build/reports/tests/test/
          if-no-files-found: warn

      - name: Upload bundle manifest
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-runtime-bundle-manifest
          path: build/sovereign-runtime-release/bundle-manifest.json
          if-no-files-found: error

      - name: Upload local Maven repo bundle
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-runtime-local-maven-repo
          path: build/sovereign-runtime-release-verification-repo/
          if-no-files-found: error

      - name: Upload sovereign release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-release-artifacts
          path: |
            build/sovereign-release/release-artifacts-v1.json
            build/sovereign-release/artifacts/
          if-no-files-found: error

      - name: Upload evidence index
        # Evidence index is produced only by generateSovereignReleaseEvidenceIndex,
        # which runs in the full release-certification aggregate
        # (verifySovereignRuntimeClosure) — not in the PR-scoped
        # verifySovereignRuntimePullRequest. Upload only on workflow_dispatch.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-release-evidence-index
          path: |
            build/sovereign-runtime-release/evidence-index.json
            build/sovereign-runtime-release/evidence-index.md
          if-no-files-found: error

      - name: Upload benchmark reports (deep lane)
        # Epic 12.1a: timing benchmarks run only on workflow_dispatch
        # (-Dtramai.benchmark=true); persist their JSON so deep/release
        # measurements survive the runner. PR runs produce nothing.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-benchmark-reports
          path: '**/build/reports/benchmark/*.json'
          if-no-files-found: error

      - name: Compare deep-lane benchmark run against 0.6.0 baseline (Epic 12.1d)
        # Timing drift is NOT a failure here: candidates are classified, never
        # auto-rejected. The step fails closed ONLY on structural errors
        # (INVALID_MEASUREMENT / NON_COMPARABLE) — missing population,
        # malformed JSON, wrong measured commit, schema/authority mismatch.
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p build
          set +e
          python3 scripts/performance_regression_verifier.py verify \
            --baseline config/quality/performance/0.6.0-performance-baseline.json \
            --runs '**/build/reports/benchmark/*.json' \
            --expected-commit "${{ github.sha }}" \
            --repo-root . --summary \
            > build/performance-regression-report.json 2>&1
          code=$?
          set -e
          python3 - <<'EOF'
          import json
          report = json.load(open('build/performance-regression-report.json'))
          status = report.get('status', 'INVALID_MEASUREMENT')
          print(f'## Epic 12.1d deep-run classification: {status}', file=open('summary.txt', 'w'))
          for op in report.get('operations', []):
              print(f"- {op['operationId']}: {op['classification']} "
                    f"(measured {op['measured']:.2f}, envelope {op['envelopeMin']:.2f}..{op['envelopeMax']:.2f})",
                    file=open('summary.txt', 'a'))
          EOF
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          if [ "$code" -ne 0 ]; then
            echo "Structural benchmark failure (exit $code): fail closed. See build/performance-regression-report.json"
            exit "$code"
          fi
          echo "Comparable report emitted; candidates require the 3-run confirmation protocol before any release adjudication."

      - name: Upload performance regression report
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-regression-report
          path: build/performance-regression-report.json
          if-no-files-found: warn

      - name: Write Summary
        run: |
          echo "## Sovereign Runtime Release Candidate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Remote publish: false" >> $GITHUB_STEP_SUMMARY
          echo "- Tag created: false" >> $GITHUB_STEP_SUMMARY
          echo "- Version: $TRAMAI_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- Full tests: passed" >> $GITHUB_STEP_SUMMARY
          echo "- Release readiness: passed" >> $GITHUB_STEP_SUMMARY
          echo "- Local publication: passed" >> $GITHUB_STEP_SUMMARY
          echo "- Signed bundle dry-run: passed" >> $GITHUB_STEP_SUMMARY
          echo "- Consumer smoke: passed" >> $GITHUB_STEP_SUMMARY
          echo "- Bundle manifest: uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- Local Maven repo: uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- Release artifacts: uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- Evidence index: uploaded" >> $GITHUB_STEP_SUMMARY

name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish or validate. Leave empty for 0.1.0-SNAPSHOT, or set a release like 0.1.0."
        required: false
        type: string
  push:
    tags:
      - "v*"

env:
  TRAMAI_CENTRAL_NAMESPACE: dev.tramai
  TRAMAI_CENTRAL_STAGING_API_URL: https://ossrh-staging-api.central.sonatype.com

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRAMAI_PUBLISH_RELEASE_URL: ${{ secrets.TRAMAI_PUBLISH_RELEASE_URL }}
      TRAMAI_PUBLISH_SNAPSHOT_URL: ${{ secrets.TRAMAI_PUBLISH_SNAPSHOT_URL }}
      TRAMAI_PUBLISH_USERNAME: ${{ secrets.TRAMAI_PUBLISH_USERNAME }}
      TRAMAI_PUBLISH_PASSWORD: ${{ secrets.TRAMAI_PUBLISH_PASSWORD }}
      TRAMAI_SIGNING_KEY: ${{ secrets.TRAMAI_SIGNING_KEY }}
      TRAMAI_SIGNING_PASSWORD: ${{ secrets.TRAMAI_SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "TRAMAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "TRAMAI_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "TRAMAI_VERSION=0.1.0-SNAPSHOT" >> "$GITHUB_ENV"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "TRAMAI_IS_RELEASE_VERSION=true" >> "$GITHUB_ENV"
          elif [[ -n "${{ github.event.inputs.version }}" && ! "${{ github.event.inputs.version }}" =~ -SNAPSHOT$ ]]; then
            echo "TRAMAI_IS_RELEASE_VERSION=true" >> "$GITHUB_ENV"
          else
            echo "TRAMAI_IS_RELEASE_VERSION=false" >> "$GITHUB_ENV"
          fi

      - name: Verify build
        env:
          ORG_GRADLE_PROJECT_tramaiVersion: ${{ env.TRAMAI_VERSION }}
        run: ./gradlew verifyReleaseReadiness --no-configuration-cache

      - name: Verify remote publish inputs
        if: ${{ env.TRAMAI_IS_RELEASE_VERSION == 'true' && env.TRAMAI_PUBLISH_RELEASE_URL != '' && env.TRAMAI_PUBLISH_USERNAME != '' && env.TRAMAI_PUBLISH_PASSWORD != '' && env.TRAMAI_SIGNING_KEY != '' && env.TRAMAI_SIGNING_PASSWORD != '' }}
        env:
          ORG_GRADLE_PROJECT_tramaiVersion: ${{ env.TRAMAI_VERSION }}
          ORG_GRADLE_PROJECT_tramaiPublishReleaseUrl: ${{ env.TRAMAI_PUBLISH_RELEASE_URL }}
          ORG_GRADLE_PROJECT_tramaiPublishSnapshotUrl: ${{ env.TRAMAI_PUBLISH_SNAPSHOT_URL }}
          ORG_GRADLE_PROJECT_tramaiPublishUsername: ${{ env.TRAMAI_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_tramaiPublishPassword: ${{ env.TRAMAI_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ env.TRAMAI_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ env.TRAMAI_SIGNING_PASSWORD }}
        run: ./gradlew verifyReleasePublishInputs --no-configuration-cache

      - name: Verify signing key is published to supported keyservers
        if: ${{ env.TRAMAI_IS_RELEASE_VERSION == 'true' && env.TRAMAI_PUBLISH_RELEASE_URL != '' && env.TRAMAI_PUBLISH_USERNAME != '' && env.TRAMAI_PUBLISH_PASSWORD != '' && env.TRAMAI_SIGNING_KEY != '' && env.TRAMAI_SIGNING_PASSWORD != '' }}
        env:
          TRAMAI_SIGNING_KEY: ${{ env.TRAMAI_SIGNING_KEY }}
        run: |
          SOURCE_GNUPGHOME="$(mktemp -d)"
          chmod 700 "$SOURCE_GNUPGHOME"
          trap 'rm -rf "$SOURCE_GNUPGHOME"' EXIT

          GNUPGHOME="$SOURCE_GNUPGHOME" gpg --batch --import <<'EOF'
          ${{ env.TRAMAI_SIGNING_KEY }}
          EOF

          SIGNING_FINGERPRINT="$(
            GNUPGHOME="$SOURCE_GNUPGHOME" gpg --batch --with-colons --list-secret-keys \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"

          if [[ -z "$SIGNING_FINGERPRINT" ]]; then
            echo "::error::Could not determine the signing key fingerprint from TRAMAI_SIGNING_KEY."
            exit 1
          fi

          echo "Resolved signing key fingerprint: $SIGNING_FINGERPRINT"

          FOUND_KEY=false
          for KEYSERVER in hkps://keys.openpgp.org hkps://keyserver.ubuntu.com; do
            LOOKUP_GNUPGHOME="$(mktemp -d)"
            chmod 700 "$LOOKUP_GNUPGHOME"

            if GNUPGHOME="$LOOKUP_GNUPGHOME" gpg --batch --no-tty --keyserver "$KEYSERVER" --recv-keys "$SIGNING_FINGERPRINT" >/dev/null 2>&1; then
              echo "Signing key is available from $KEYSERVER"
              FOUND_KEY=true
              rm -rf "$LOOKUP_GNUPGHOME"
              break
            fi

            rm -rf "$LOOKUP_GNUPGHOME"
          done

          if [[ "$FOUND_KEY" != "true" ]]; then
            echo "::error::Signing key $SIGNING_FINGERPRINT is not available from the Sonatype-supported public keyservers checked by this workflow. Publish the public key before retrying the release, for example: gpg --keyserver keyserver.ubuntu.com --send-keys $SIGNING_FINGERPRINT"
            exit 1
          fi

      - name: Publish to configured repository
        if: ${{ env.TRAMAI_PUBLISH_RELEASE_URL != '' && env.TRAMAI_PUBLISH_USERNAME != '' && env.TRAMAI_PUBLISH_PASSWORD != '' && env.TRAMAI_SIGNING_KEY != '' && env.TRAMAI_SIGNING_PASSWORD != '' }}
        env:
          ORG_GRADLE_PROJECT_tramaiVersion: ${{ env.TRAMAI_VERSION }}
          ORG_GRADLE_PROJECT_tramaiPublishReleaseUrl: ${{ env.TRAMAI_PUBLISH_RELEASE_URL }}
          ORG_GRADLE_PROJECT_tramaiPublishSnapshotUrl: ${{ env.TRAMAI_PUBLISH_SNAPSHOT_URL }}
          ORG_GRADLE_PROJECT_tramaiPublishUsername: ${{ env.TRAMAI_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_tramaiPublishPassword: ${{ env.TRAMAI_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ env.TRAMAI_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ env.TRAMAI_SIGNING_PASSWORD }}
        run: ./gradlew publish --no-configuration-cache

      - name: Upload tagged release deployment to Central Portal
        if: ${{ env.TRAMAI_IS_RELEASE_VERSION == 'true' && env.TRAMAI_PUBLISH_RELEASE_URL != '' && env.TRAMAI_PUBLISH_USERNAME != '' && env.TRAMAI_PUBLISH_PASSWORD != '' && env.TRAMAI_SIGNING_KEY != '' && env.TRAMAI_SIGNING_PASSWORD != '' }}
        env:
          TRAMAI_PUBLISH_USERNAME: ${{ env.TRAMAI_PUBLISH_USERNAME }}
          TRAMAI_PUBLISH_PASSWORD: ${{ env.TRAMAI_PUBLISH_PASSWORD }}
        run: |
          AUTH_TOKEN=$(printf '%s:%s' "$TRAMAI_PUBLISH_USERNAME" "$TRAMAI_PUBLISH_PASSWORD" | base64 | tr -d '\n')
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer $AUTH_TOKEN" \
            -H "Accept: application/json" \
            "${TRAMAI_CENTRAL_STAGING_API_URL}/manual/upload/defaultRepository/${TRAMAI_CENTRAL_NAMESPACE}?publishing_type=user_managed"

      - name: Publish to Maven Local smoke target
        if: ${{ !(env.TRAMAI_PUBLISH_RELEASE_URL != '' && env.TRAMAI_PUBLISH_USERNAME != '' && env.TRAMAI_PUBLISH_PASSWORD != '' && env.TRAMAI_SIGNING_KEY != '' && env.TRAMAI_SIGNING_PASSWORD != '') }}
        env:
          ORG_GRADLE_PROJECT_tramaiVersion: ${{ env.TRAMAI_VERSION }}
        run: ./gradlew publishToMavenLocal --no-configuration-cache

      - name: Publish to Maven Local for example smoke test
        env:
          ORG_GRADLE_PROJECT_tramaiVersion: ${{ env.TRAMAI_VERSION }}
        run: ./gradlew publishToMavenLocal --no-configuration-cache

      - name: Run example smoke test
        run: ./gradlew -p examples/kotlin-springboot-example smokeTest --no-configuration-cache

name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  TRAMAI_CENTRAL_NAMESPACE: dev.tramai
  TRAMAI_CENTRAL_STAGING_API_URL: https://ossrh-staging-api.central.sonatype.com

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "TRAMAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "TRAMAI_VERSION=0.1.0-SNAPSHOT" >> "$GITHUB_ENV"
          fi

      - name: Verify build
        env:
          ORG_GRADLE_PROJECT_tramaiVersion: ${{ env.TRAMAI_VERSION }}
        run: ./gradlew verifyReleaseReadiness --no-configuration-cache

      - name: Verify remote publish inputs
        if: ${{ secrets.TRAMAI_PUBLISH_RELEASE_URL != '' && secrets.TRAMAI_PUBLISH_USERNAME != '' && secrets.TRAMAI_PUBLISH_PASSWORD != '' && secrets.TRAMAI_SIGNING_KEY != '' && secrets.TRAMAI_SIGNING_PASSWORD != '' }}
        env:
          ORG_GRADLE_PROJECT_tramaiVersion: ${{ env.TRAMAI_VERSION }}
          ORG_GRADLE_PROJECT_tramaiPublishReleaseUrl: ${{ secrets.TRAMAI_PUBLISH_RELEASE_URL }}
          ORG_GRADLE_PROJECT_tramaiPublishSnapshotUrl: ${{ secrets.TRAMAI_PUBLISH_SNAPSHOT_URL }}
          ORG_GRADLE_PROJECT_tramaiPublishUsername: ${{ secrets.TRAMAI_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_tramaiPublishPassword: ${{ secrets.TRAMAI_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.TRAMAI_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.TRAMAI_SIGNING_PASSWORD }}
        run: ./gradlew verifyReleasePublishInputs --no-configuration-cache

      - name: Publish to configured repository
        if: ${{ secrets.TRAMAI_PUBLISH_RELEASE_URL != '' && secrets.TRAMAI_PUBLISH_USERNAME != '' && secrets.TRAMAI_PUBLISH_PASSWORD != '' && secrets.TRAMAI_SIGNING_KEY != '' && secrets.TRAMAI_SIGNING_PASSWORD != '' }}
        env:
          ORG_GRADLE_PROJECT_tramaiVersion: ${{ env.TRAMAI_VERSION }}
          ORG_GRADLE_PROJECT_tramaiPublishReleaseUrl: ${{ secrets.TRAMAI_PUBLISH_RELEASE_URL }}
          ORG_GRADLE_PROJECT_tramaiPublishSnapshotUrl: ${{ secrets.TRAMAI_PUBLISH_SNAPSHOT_URL }}
          ORG_GRADLE_PROJECT_tramaiPublishUsername: ${{ secrets.TRAMAI_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_tramaiPublishPassword: ${{ secrets.TRAMAI_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.TRAMAI_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.TRAMAI_SIGNING_PASSWORD }}
        run: ./gradlew publish --no-configuration-cache

      - name: Upload tagged release deployment to Central Portal
        if: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TRAMAI_PUBLISH_RELEASE_URL != '' && secrets.TRAMAI_PUBLISH_USERNAME != '' && secrets.TRAMAI_PUBLISH_PASSWORD != '' && secrets.TRAMAI_SIGNING_KEY != '' && secrets.TRAMAI_SIGNING_PASSWORD != '' }}
        env:
          TRAMAI_PUBLISH_USERNAME: ${{ secrets.TRAMAI_PUBLISH_USERNAME }}
          TRAMAI_PUBLISH_PASSWORD: ${{ secrets.TRAMAI_PUBLISH_PASSWORD }}
        run: |
          AUTH_TOKEN=$(printf '%s:%s' "$TRAMAI_PUBLISH_USERNAME" "$TRAMAI_PUBLISH_PASSWORD" | base64 | tr -d '\n')
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer $AUTH_TOKEN" \
            -H "Accept: application/json" \
            "${TRAMAI_CENTRAL_STAGING_API_URL}/manual/upload/defaultRepository/${TRAMAI_CENTRAL_NAMESPACE}?publishing_type=user_managed"

      - name: Publish to Maven Local smoke target
        if: ${{ !(secrets.TRAMAI_PUBLISH_RELEASE_URL != '' && secrets.TRAMAI_PUBLISH_USERNAME != '' && secrets.TRAMAI_PUBLISH_PASSWORD != '' && secrets.TRAMAI_SIGNING_KEY != '' && secrets.TRAMAI_SIGNING_PASSWORD != '') }}
        env:
          ORG_GRADLE_PROJECT_tramaiVersion: ${{ env.TRAMAI_VERSION }}
        run: ./gradlew publishToMavenLocal --no-configuration-cache

      - name: Publish to Maven Local for example smoke test
        env:
          ORG_GRADLE_PROJECT_tramaiVersion: ${{ env.TRAMAI_VERSION }}
        run: ./gradlew publishToMavenLocal --no-configuration-cache

      - name: Run example smoke test
        run: ./gradlew -p examples/kotlin-springboot-example test --no-configuration-cache

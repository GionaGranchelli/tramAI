name: Maintainability Baseline

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish.yml'

jobs:
  verify-baseline:
    name: Verify Maintainability Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Detect baseline-migration label
        id: label-check
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels) }}'
          if echo "$LABELS" | grep -q '"baseline-migration"'; then
            echo "changeClass=baseline-migration" >> "$GITHUB_OUTPUT"
          else
            echo "changeClass=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Change Policy
        run: |
          CHANGE_CLASS="${{ steps.label-check.outputs.changeClass }}"
          if [ -n "$CHANGE_CLASS" ]; then
            ./gradlew verifyChangePolicy --no-daemon \
              -PchangePolicyBase=${{ github.event.pull_request.base.sha }} \
              -PchangeClass="$CHANGE_CLASS"
          else
            ./gradlew verifyChangePolicy --no-daemon \
              -PchangePolicyBase=${{ github.event.pull_request.base.sha }}
          fi

      - name: Verify Maintainability Baseline
        run: ./gradlew verifyMaintainabilityBaseline --no-daemon

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintainability-reports
          path: build/reports/maintainability/
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "## Maintainability Baseline Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ -f build/reports/maintainability/module-dependencies.json ]; then
            echo "| Module Dependency Graph | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
            CYCLES=$(python3 -c "import json; d=json.load(open('build/reports/maintainability/module-dependencies.json')); print(len(d.get('cycles',[])))" 2>/dev/null || echo "?")
            if [ "$CYCLES" != "0" ] && [ "$CYCLES" != "?" ]; then
              echo "| Dependency Cycles | ⚠️ $CYCLES cycles detected |" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ -f build/reports/maintainability/cancellation-safety.json ]; then
            CRITICAL=$(python3 -c "import json; d=json.load(open('build/reports/maintainability/cancellation-safety.json')); print(sum(1 for f in d.get('findings',[]) if f.get('risk')=='critical'))" 2>/dev/null || echo "?")
            echo "| Cancellation Safety | $CRITICAL critical findings |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports uploaded as artifact: \`maintainability-reports\`" >> $GITHUB_STEP_SUMMARY

  # Phase 2: build-logic tests run as a parallel matrix instead of one serial
  # invocation after the maintainability checks. JDK 21 (AGENTS.md rule 6:
  # build-logic compatibility). The lanes partition the build-logic suite by
  # domain, each with its own exact count assertion so drift between lanes
  # cannot hide (mirrors ci.yml contract-tests matrix).
  # The quality-contract suite (FormattingGate/StaticSafety/CancellationWiring/
  # CompilerWarnings/DependencyHygiene/StaticAnalysis, 179 tests) runs here in
  # four parallel JDK 21 lanes mirroring ci.yml's contract-tests partitions —
  # ci.yml runs the same filters on JDK 25, so both compatibility authorities
  # (rule 6: JDK 21 for build-logic, JDK 25 for production code) stay covered.
  # #362 (10.3c1) enrolled in policy-maintainability: MutationIdentityTest (4) +
  # MutationMeasurementDiscriminatorTest (29) + MutationPopulationTest (7) +
  # MutationReportParserTest (+6) = 211 -> 257.
  # #394 (10.3c3) enrolled MutationRatchetDiscriminatorTest (23) +
  # MutationRatchetClassificationDiscriminatorTest (13) +
  # MutationRatchetAuthorityTest (7) = 257 -> 300.
  # Counts: 8 + 71 + 75 + 25 (quality) + 144 + 300 + 248 = 871.
  build-logic-tests:
    name: build-logic (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quality-formatting
            test-filter: >-
              --tests 'dev.tramai.build.quality.FormattingGate*Test'
            expected: 8
          - name: quality-static-safety
            test-filter: >-
              --tests 'dev.tramai.build.quality.StaticSafety*Test'
              --tests 'dev.tramai.build.quality.CancellationWiringTest'
            expected: 71
          - name: quality-compiler-deps
            test-filter: >-
              --tests 'dev.tramai.build.quality.CompilerWarnings*Test'
              --tests 'dev.tramai.build.quality.DependencyHygiene*Test'
            expected: 75
          - name: quality-static-analysis
            test-filter: >-
              --tests 'dev.tramai.build.quality.StaticAnalysis*Test'
            expected: 25
          - name: release-sovereign
            test-filter: >-
              --tests 'dev.tramai.build.release.*'
              --tests 'dev.tramai.build.sovereign.*'
              --tests 'dev.tramai.build.supplychain.*'
              --tests 'dev.tramai.build.publishing.*'
              --tests 'dev.tramai.build.docs.*'
              --tests 'dev.tramai.build.conventions.*'
            expected: 144
          - name: policy-maintainability
            test-filter: >-
              --tests 'dev.tramai.build.quality.ChangePolicy*Test'
              --tests 'dev.tramai.build.quality.DeviationBudgetEvaluatorTest'
              --tests 'dev.tramai.build.quality.FindingIdentityTest'
              --tests 'dev.tramai.build.quality.MaintainabilityBaselineVerificationTest'
              --tests 'dev.tramai.build.quality.Mutation*Test'
              --tests 'dev.tramai.build.quality.Nondeterminism*Test'
              --tests 'dev.tramai.build.quality.RuntimeNondeterminismGateTest'
              --tests 'dev.tramai.build.quality.ModuleCatalogMutationTest'
              --tests 'dev.tramai.build.quality.ModuleTopologyVerificationTest'
              --tests 'dev.tramai.build.quality.ModuleDocContractVerifierTest'
              --tests 'dev.tramai.build.quality.DetektBaselineGrowthDriftTest'
              --tests 'dev.tramai.build.quality.DependencyBaselineVerifierTest'
              --tests 'dev.tramai.build.quality.DependencyEdgeNormalizerTest'
            expected: 300
          - name: scanners-coverage
            test-filter: >-
              --tests 'dev.tramai.build.quality.KotlinCancellationCatchScannerTest'
              --tests 'dev.tramai.build.quality.ApiCompatibilityMutationTest'
              --tests 'dev.tramai.build.quality.ApiBaselineVerifierTest'
              --tests 'dev.tramai.build.quality.JUnitTestSignatureVerifierTest'
              --tests 'dev.tramai.build.quality.CancellationDeltaComparatorTest'
              --tests 'dev.tramai.build.quality.CoveragePolicyDeltaVerifierTest'
              --tests 'dev.tramai.build.quality.CoverageMeasurementDiscriminatorTest'
              --tests 'dev.tramai.build.quality.CoverageReportParserTest'
              --tests 'dev.tramai.build.quality.CoverageAuthorityTest'
              --tests 'dev.tramai.build.quality.CoverageWiringTest'
              --tests 'dev.tramai.build.quality.CrossModuleCoverageTest'
              --tests 'dev.tramai.build.quality.ArchitectureReportAggregatorTest'
              --tests 'dev.tramai.build.quality.CanonicalProbeFunctionalTest'
              --tests 'dev.tramai.build.quality.ResidualQualityVerifierTasksTest'
              --tests 'dev.tramai.build.quality.TypedTaskConfigurationCacheTest'
              --tests 'dev.tramai.build.quality.TestQualityConfigurationTest'
              --tests 'dev.tramai.build.quality.TestPerformanceVerifierTest'
              --tests 'dev.tramai.build.quality.TestPerformanceAggregatorTest'
              --tests 'dev.tramai.build.quality.ResolvedDependencyAggregateTest'
            expected: 248

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # P3-D: matrix lanes run plain :build-logic:test with fully-declared
      # inputs (no -P base-ref props), so writing the build cache is safe.
      # setup-gradle's DEFAULT is branch-based read-only (jobs off the default
      # branch never write), which is why MB lanes were always cold while CI's
      # master-push runs warmed CI's cache. MB never runs on master (PR-only
      # trigger), so without an explicit override NOTHING ever writes MB's
      # cache namespace. Write only for same-repository PR branches (repeated
      # runs/rebases restore FROM-CACHE instead of re-paying 6-10m compile+
      # test per lane); fork PRs stay read-only so external PRs cannot write
      # to the repository's cache quota. verify-baseline stays explicitly
      # cache-read-only: its gates consume -PchangePolicyBase
      # (configuration-time, untracked as task inputs), so caching could
      # serve a stale result computed against a different base SHA.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.fork }}

      - name: Run ${{ matrix.name }} build-logic tests
        run: |
          ./gradlew :build-logic:test ${{ matrix.test-filter }} --no-daemon
          python3 - <<'EOF'
          import glob, re
          total = 0
          for f in glob.glob('build-logic/build/test-results/test/TEST-*.xml'):
              m = re.search(r'tests="(\d+)"', open(f).read())
              total += int(m.group(1)) if m else 0
          assert total == ${{ matrix.expected }}, f'expected exactly ${{ matrix.expected }} ${{ matrix.name }} build-logic tests, discovered {total}'
          EOF

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logic-${{ matrix.name }}-test-reports
          path: |
            build-logic/build/test-results/test/
            build-logic/build/reports/tests/test/

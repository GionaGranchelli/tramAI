name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Print revision fingerprints
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TramaiEngine.kt sha256=$(sha256sum tramai-engine/src/main/kotlin/dev/tramai/engine/TramaiEngine.kt | cut -d' ' -f1)"
          echo "TramaiEngineTest.kt sha256=$(sha256sum tramai-engine/src/test/kotlin/dev/tramai/engine/TramaiEngineTest.kt | cut -d' ' -f1)"

      - name: Verify Kotlin formatting against PR base
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew spotlessCheck \
            --no-daemon \
            -PtramaiFormattingBaseRef="${{ github.event.pull_request.base.sha }}"

      - name: Verify Kotlin formatting against push base
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          ./gradlew spotlessCheck \
            --no-daemon \
            -PtramaiFormattingBaseRef="${{ github.event.before }}"

      - name: Run formatting gate contract tests
        run: |
          ./gradlew :build-logic:test --tests 'dev.tramai.build.quality.FormattingGate*Test' --no-daemon
          python3 - <<'EOF'
          import glob, re
          total = 0
          for f in glob.glob('build-logic/build/test-results/test/TEST-*.FormattingGate*Test.xml'):
              m = re.search(r'tests="(\d+)"', open(f).read())
              total += int(m.group(1)) if m else 0
          assert total == 8, f'expected exactly 8 formatting-gate tests, discovered {total}'
          EOF

      - name: Verify static analysis against PR base
        if: github.event_name == 'pull_request'
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels) }}'
          if echo "$LABELS" | grep -q '"baseline-migration"'; then
            ./gradlew verifyStaticAnalysis --no-daemon \
              -PtramaiStaticAnalysisBaseRef="${{ github.event.pull_request.base.sha }}" \
              -PchangeClass=baseline-migration
          else
            ./gradlew verifyStaticAnalysis --no-daemon \
              -PtramaiStaticAnalysisBaseRef="${{ github.event.pull_request.base.sha }}"
          fi

      - name: Verify static analysis against push base
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          ./gradlew verifyStaticAnalysis --no-daemon \
            -PtramaiStaticAnalysisBaseRef="${{ github.event.before }}"

      - name: Run static-analysis contract tests
        timeout-minutes: 20
        run: |
          ./gradlew :build-logic:test --tests 'dev.tramai.build.quality.StaticAnalysis*Test' --no-daemon
          python3 - <<'EOF'
          import glob, re
          total = 0
          for f in glob.glob('build-logic/build/test-results/test/TEST-*.StaticAnalysis*Test.xml'):
              m = re.search(r'tests="(\d+)"', open(f).read())
              total += int(m.group(1)) if m else 0
          assert total == 24, f'expected exactly 24 static-analysis tests, discovered {total}'
          EOF

      - name: Run tests
        timeout-minutes: 15
        run: |
          ./gradlew test &
          GRADLE_PID=$!
          DUMP_DIR=/tmp/threaddumps
          mkdir -p "$DUMP_DIR"
          # Containment watchdog: if tests exceed ~12 min, dump worker threads and
          # fail fast instead of letting a concurrency flake hold the pipeline
          # hostage for the full timeout.
          for i in $(seq 1 18); do
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then break; fi
            sleep 40
          done
          if kill -0 "$GRADLE_PID" 2>/dev/null; then
            echo "::error::Run tests exceeded 12 minutes — dumping threads and aborting"
            for P in $(jps -l 2>/dev/null | grep -iE 'GradleWorkerMain|GradleDaemon' | awk '{print $1}'); do
              jstack "$P" > "$DUMP_DIR/worker-$P-$(date +%H%M%S).txt" 2>&1 || true
            done
            kill "$GRADLE_PID" 2>/dev/null || true
            wait "$GRADLE_PID" 2>/dev/null || true
            exit 1
          fi
          wait "$GRADLE_PID"

      - name: Upload test hang thread dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-threaddumps
          path: /tmp/threaddumps/
          if-no-files-found: warn

      - name: Print compiled fingerprints
        run: |
          find tramai-engine/build -name 'TramaiEngine*.class' 2>/dev/null | sort | while read -r f; do
            echo "$(sha256sum "$f" | cut -d' ' -f1)  ${f#tramai-engine/build/}"
          done

      - name: Verify cancellation safety against PR base
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew verifyCancellationSafety \
            --no-daemon \
            -PtramaiCancellationBaseSha="${{ github.event.pull_request.base.sha }}"

      - name: Verify cancellation safety against previous master
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          ./gradlew verifyCancellationSafety \
            --no-daemon \
            -PtramaiCancellationBaseSha="${{ github.event.before }}"

      - name: Publish to Maven Local for example smoke test
        run: ./gradlew publishToMavenLocal

      - name: Run example smoke test
        run: |
          TRAMAI_VERSION="$(grep '^tramaiVersion=' gradle.properties | cut -d= -f2)"
          echo "Smoke test version: ${TRAMAI_VERSION}"
          ./gradlew -p examples/kotlin-springboot-example test \
            -PtramaiVersion="${TRAMAI_VERSION}"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/test/
            **/build/reports/tests/test/

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom

      - name: Compute SBOM digest + copy
        run: ./gradlew prepareCycloneDxBom

      - name: Prepare sovereign release artifacts
        run: ./gradlew prepareSovereignReleaseArtifacts

      - name: Verify sovereign release manifest
        run: ./gradlew verifySovereignReleaseManifest

      - name: Run sovereign document intelligence example
        run: ./gradlew :examples:sovereign-document-intelligence:run --args="--release-bundle-manifest=build/sovereign-release/release-artifacts-v1.json"

      - name: Run Spring sovereign starter example tests
        run: ./gradlew :examples:spring-sovereign-starter:test

      - name: Run Spring sovereign starter E2E tests
        run: ./gradlew :examples:spring-sovereign-starter:e2eTest

      - name: Verify Sovereign Runtime closure
        timeout-minutes: 15
        # No --rerun-tasks: the normal test phase already ran the full suite.
        # Rerunning here doubles the exposure to probabilistic concurrency flakes
        # (observed: JdbcStepAttemptRecordStoreContractTest #19 failed only in
        # the closure re-run, with the same head passing the initial Run tests).
        run: ./gradlew verifySovereignRuntimeClosure --no-configuration-cache -PtramaiPublishReleaseUrl=

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            build/supply-chain/sbom/tramai-cyclonedx-sbom.json

      - name: Upload SBOM digest
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom-digest
          path: |
            build/supply-chain/sbom/tramai-cyclonedx-sbom.sha256

      - name: Upload sovereign release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-release-artifacts
          path: |
            build/sovereign-release/artifacts/
            build/sovereign-release/release-artifacts-v1.json

      - name: Attest release artifact manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/sovereign-release/release-artifacts-v1.json

  zero-egress:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom

      - name: Compute SBOM digest + copy
        run: ./gradlew prepareCycloneDxBom

      - name: Prepare sovereign release artifacts
        run: ./gradlew prepareSovereignReleaseArtifacts

      - name: Verify sovereign release manifest
        run: ./gradlew verifySovereignReleaseManifest

      - name: Run zero-egress verification harness
        run: ./scripts/verify-zero-egress.sh
        env:
          TRAMAI_RELEASE_BUNDLE_MANIFEST: ${{ github.workspace }}/build/sovereign-release/release-artifacts-v1.json

      - name: Verify evidence pack contains release bundle
        run: ./gradlew verifySovereignEvidencePackContainsReleaseBundle

      - name: Upload evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-evidence-pack
          path: |
            build/zero-egress-report/sovereign-evidence-pack-v1.json

      - name: Assemble sovereign evidence bundle
        run: ./gradlew prepareSovereignEvidenceBundle

      - name: Verify sovereign evidence bundle release manifest
        run: ./gradlew verifySovereignEvidenceBundleReleaseManifest

      - name: Upload sovereign evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-evidence-bundle
          path: |
            build/sovereign-evidence/

      - name: Attest sovereign evidence pack
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/sovereign-evidence/sovereign-evidence-pack-v1.json

      - name: Attest zero-egress report
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/sovereign-evidence/zero-egress-report.json

      - name: Attest release artifact manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/sovereign-evidence/release/release-artifacts-v1.json

      - name: Attest SBOM for sovereign evidence pack
        uses: actions/attest@v4
        with:
          subject-path: build/sovereign-evidence/sovereign-evidence-pack-v1.json
          sbom-path: build/sovereign-evidence/supply-chain/tramai-cyclonedx-sbom.json

      - name: Upload zero-egress report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zero-egress-verification-report
          path: |
            build/zero-egress-report/zero-egress-report.json

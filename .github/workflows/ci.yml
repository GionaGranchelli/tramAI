name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Publish to Maven Local for example smoke test
        run: ./gradlew publishToMavenLocal

      - name: Run example smoke test
        run: ./gradlew -p examples/kotlin-springboot-example test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/test/
            **/build/reports/tests/test/

  zero-egress:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run zero-egress verification harness
        run: ./scripts/verify-zero-egress.sh

      - name: Upload evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-evidence-pack
          path: |
            build/zero-egress-report/sovereign-evidence-pack-v1.json

      - name: Upload zero-egress report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zero-egress-verification-report
          path: |
            build/zero-egress-report/zero-egress-report.json

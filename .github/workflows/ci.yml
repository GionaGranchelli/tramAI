name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Verify cancellation safety
        run: ./gradlew verifyCancellationSafety

      - name: Publish to Maven Local for example smoke test
        run: ./gradlew publishToMavenLocal

      - name: Run example smoke test
        run: |
          TRAMAI_VERSION="$(grep '^tramaiVersion=' gradle.properties | cut -d= -f2)"
          echo "Smoke test version: ${TRAMAI_VERSION}"
          ./gradlew -p examples/kotlin-springboot-example test \
            -PtramaiVersion="${TRAMAI_VERSION}"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/test/
            **/build/reports/tests/test/

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom

      - name: Compute SBOM digest + copy
        run: ./gradlew prepareCycloneDxBom

      - name: Prepare sovereign release artifacts
        run: ./gradlew prepareSovereignReleaseArtifacts

      - name: Verify sovereign release manifest
        run: ./gradlew verifySovereignReleaseManifest

      - name: Run sovereign document intelligence example
        run: ./gradlew :examples:sovereign-document-intelligence:run --args="--release-bundle-manifest=build/sovereign-release/release-artifacts-v1.json"

      - name: Run Spring sovereign starter example tests
        run: ./gradlew :examples:spring-sovereign-starter:test

      - name: Run Spring sovereign starter E2E tests
        run: ./gradlew :examples:spring-sovereign-starter:e2eTest

      - name: Verify Sovereign Runtime closure
        run: ./gradlew verifySovereignRuntimeClosure --no-configuration-cache --rerun-tasks -PtramaiPublishReleaseUrl=

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            build/supply-chain/sbom/tramai-cyclonedx-sbom.json

      - name: Upload SBOM digest
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom-digest
          path: |
            build/supply-chain/sbom/tramai-cyclonedx-sbom.sha256

      - name: Upload sovereign release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-release-artifacts
          path: |
            build/sovereign-release/artifacts/
            build/sovereign-release/release-artifacts-v1.json

      - name: Attest release artifact manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/sovereign-release/release-artifacts-v1.json

  zero-egress:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom

      - name: Compute SBOM digest + copy
        run: ./gradlew prepareCycloneDxBom

      - name: Prepare sovereign release artifacts
        run: ./gradlew prepareSovereignReleaseArtifacts

      - name: Verify sovereign release manifest
        run: ./gradlew verifySovereignReleaseManifest

      - name: Run zero-egress verification harness
        run: ./scripts/verify-zero-egress.sh
        env:
          TRAMAI_RELEASE_BUNDLE_MANIFEST: ${{ github.workspace }}/build/sovereign-release/release-artifacts-v1.json

      - name: Verify evidence pack contains release bundle
        run: ./gradlew verifySovereignEvidencePackContainsReleaseBundle

      - name: Upload evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-evidence-pack
          path: |
            build/zero-egress-report/sovereign-evidence-pack-v1.json

      - name: Assemble sovereign evidence bundle
        run: ./gradlew prepareSovereignEvidenceBundle

      - name: Verify sovereign evidence bundle release manifest
        run: ./gradlew verifySovereignEvidenceBundleReleaseManifest

      - name: Upload sovereign evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-evidence-bundle
          path: |
            build/sovereign-evidence/

      - name: Attest sovereign evidence pack
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/sovereign-evidence/sovereign-evidence-pack-v1.json

      - name: Attest zero-egress report
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/sovereign-evidence/zero-egress-report.json

      - name: Attest release artifact manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/sovereign-evidence/release/release-artifacts-v1.json

      - name: Attest SBOM for sovereign evidence pack
        uses: actions/attest@v4
        with:
          subject-path: build/sovereign-evidence/sovereign-evidence-pack-v1.json
          sbom-path: build/sovereign-evidence/supply-chain/tramai-cyclonedx-sbom.json

      - name: Upload zero-egress report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zero-egress-verification-report
          path: |
            build/zero-egress-report/zero-egress-report.json

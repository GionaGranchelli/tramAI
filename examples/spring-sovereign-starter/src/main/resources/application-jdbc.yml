tramai:
  sovereign:
    enabled: true
    allowed-models:
      - local-invoice-model
    allowed-providers:
      - deterministic-local-provider
    provider-zones:
      deterministic-local-provider: LOCAL
    models:
      local-invoice-model: deterministic-local-provider

    persistence:
      type: jdbc
      jdbc:
        claim-lease-duration: 5m
        max-claim-limit: 500
      encryption:
        key-file: ${TRAMAI_JDBC_KEY_FILE:}
        key-id: default

# Sovereign Lab Profile — Physical Local-Model Testing
#
# Activate with: --spring.profiles.active=sovereign-lab
#
# This profile configures TramAI Sovereign Runtime for local-only execution:
# - PostgreSQL for durable persistence
# - A local OpenAI-compatible model endpoint (e.g. Ollama, llama.cpp, vLLM)
# - Approval workflow, REST control plane, and reviewer UI enabled
# - No cloud providers

# ── Sovereign Runtime & Local Provider ──
tramai:
  sovereign:
    enabled: true
    allowed-models:
      # local-invoice-model keeps the existing invoice example path bootable
      # via the deterministic local provider (no real inference needed).
      - local-invoice-model
      # local-lab-model is the OpenAI-compatible local model used for
      # physical lab testing with Ollama/llama.cpp/vLLM.
      - local-lab-model
    allowed-providers:
      # deterministic-local-provider is a test stub that returns
      # predictable results — used by the invoice example workflow.
      - deterministic-local-provider
      # local-lab-provider points to the user's local OpenAI-compatible
      # endpoint (Ollama, llama.cpp, vLLM, etc.) for real model inference.
      - local-lab-provider
    provider-zones:
      deterministic-local-provider: LOCAL
      local-lab-provider: LOCAL
    models:
      local-invoice-model: deterministic-local-provider
      local-lab-model: local-lab-provider

    # ── JDBC Persistence ──
    persistence:
      type: jdbc
      jdbc:
        claim-lease-duration: 5m
        max-claim-limit: 500
      encryption:
        key-file: ${TRAMAI_SOVEREIGN_KEY_FILE:./.local/sovereign.key}
        key-id: default

    # ── Operations: REST, UI, resume worker ──
    ops:
      rest-control-plane-enabled: true
      reviewer-ui-enabled: true
      approved-resume-worker-enabled: true
      approval-gateway:
        non-transactional-fallback-enabled: false

      # ── Operator security (mandatory with the REST control plane since 0.7.6e) ──
      #
      # 0.7.6e fails startup when rest-control-plane-enabled=true and operator security is off, because a
      # reachable approve/deny route without verified identity is the privilege escalation the epic exists
      # to remove. The lab profile therefore configures the boundary: point the issuer and JWKS at your own
      # identity provider, and keep the mappings below in step with the approver roles your approvals use.
      #
      # The three parts are interlocked on purpose:
      #   role-mappings            role claim value -> capabilities (may the operator call the endpoint)
      #   approver-role-mappings   role claim value -> approver roles (what the token can grant at all)
      #   approval-policies        persisted policyVersion -> roles permitted to decide it
      # Every role named under approval-policies must appear in approver-role-mappings, or startup fails:
      # a requirement no verified operator can satisfy is a configuration error, not a silent deny.
      security:
        enabled: true
        issuer: ${TRAMAI_OPERATOR_ISSUER:https://lab-idp.local/}
        audience: ${TRAMAI_OPERATOR_AUDIENCE:tramai-sovereign-lab}
        jwk-set-uri: ${TRAMAI_OPERATOR_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
        role-claim: roles
        role-mappings:
          approval-reviewer: [decide-approval]
          governance-reader: [inspect-governance]
        approver-role-mappings:
          approval-reviewer: [medical-reviewer, reviewer]
        approval-policies:
          # Keyed by the policyVersion the sovereign gateway actually persists on an approval, which is
          # 0.4.0-preview today (0.7.6e F5 residual: the requirement is keyed by that persisted version, not
          # by the requiredRole the gateway was called with). A key that does not match denies every
          # decision with APPROVAL_POLICY_UNAVAILABLE.
          "0.4.0-preview": [medical-reviewer, reviewer]

  providers:
    local-lab-provider:
      type: openai
      base-url: ${TRAMAI_LOCAL_BASE_URL:http://localhost:11434/v1}
      api-key: ${TRAMAI_LOCAL_API_KEY:local-dev}
      model: ${TRAMAI_LOCAL_MODEL:qwen2.5:7b}

# ── PostgreSQL ──
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tramai_sovereign_lab}
    username: ${SPRING_DATASOURCE_USERNAME:tramai}
    password: ${SPRING_DATASOURCE_PASSWORD:tramai}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

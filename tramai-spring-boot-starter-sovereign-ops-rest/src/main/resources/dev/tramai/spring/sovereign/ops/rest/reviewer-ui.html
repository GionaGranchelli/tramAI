<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TramAI Sovereign Approval Reviewer — Preview</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
.warning { background: #3d2e00; border: 1px solid var(--yellow); color: var(--yellow); padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.header h1 { font-size: 24px; font-weight: 600; }
.header .badge { background: var(--yellow); color: #000; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
.filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.filters label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.filters select, .filters input { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
.filters button { background: var(--accent); color: #000; border: none; padding: 6px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.filters button:hover { opacity: 0.9; }
.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
.list-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.list-panel .list-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
.list-panel table { width: 100%; border-collapse: collapse; }
.list-panel th { text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
.list-panel td { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--border); cursor: pointer; }
.list-panel tr:hover td { background: rgba(88,166,255,0.08); }
.list-panel tr.selected td { background: rgba(88,166,255,0.15); }
.status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.status.pending { background: rgba(210,153,34,0.15); color: var(--yellow); }
.status.approved { background: rgba(63,185,80,0.15); color: var(--green); }
.status.denied { background: rgba(248,81,73,0.15); color: var(--red); }
.detail-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
.detail-panel h3 { font-size: 16px; margin-bottom: 16px; }
.detail-panel .field { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.detail-panel .field .label { color: var(--muted); }
.detail-panel .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.detail-panel .actions button { padding: 8px 20px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-approve { background: var(--green); color: #000; }
.btn-deny { background: var(--red); color: #fff; }
.btn-resume { background: var(--accent); color: #000; }
.detail-panel .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
.result { margin-top: 16px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
.result.success { background: rgba(63,185,80,0.12); color: var(--green); border: 1px solid rgba(63,185,80,0.3); display: block; }
.result.error { background: rgba(248,81,73,0.12); color: var(--red); border: 1px solid rgba(248,81,73,0.3); display: block; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.loading { text-align: center; padding: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="warning">⚠️ Preview UI — not designed for production. Disabled by default. Deploy behind authentication.</div>
<div class="header">
  <h1>TramAI Sovereign Approval Reviewer — Preview</h1>
  <span class="badge">Preview</span>
</div>

<div class="filters">
  <label>Status <select id="filter-status"><option value="PENDING">PENDING</option><option value="APPROVED">APPROVED</option><option value="DENIED">DENIED</option></select></label>
  <label>Required Role <input type="text" id="filter-role" placeholder="e.g. medical-reviewer"></label>
  <button onclick="loadInbox()">Refresh</button>
</div>

<div class="layout">
  <div class="list-panel">
    <div class="list-header"><span>Pending Approvals</span><span id="count-label"></span></div>
    <div id="inbox-list"><div class="loading">Loading…</div></div>
  </div>
  <div class="detail-panel" id="detail-panel">
    <h3>Select an approval</h3>
    <p style="color:var(--muted);font-size:13px;">Click a row to view details.</p>
  </div>
</div>

<script>
const BASE = '/tramai/sovereign';
let selectedId = null;
let workItems = [];

async function loadInbox() {
  const status = document.getElementById('filter-status').value;
  const role = document.getElementById('filter-role').value.trim();
  let url = `${BASE}/approvals?status=${status}&limit=50`;
  if (role) url += `&requiredRole=${encodeURIComponent(role)}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    workItems = data.items || [];
    document.getElementById('count-label').textContent = `${workItems.length} items`;
    renderList();
  } catch (e) {
    document.getElementById('inbox-list').innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
  }
}

function renderList() {
  const container = document.getElementById('inbox-list');
  if (workItems.length === 0) {
    container.innerHTML = '<div class="empty">No approval items found.</div>';
    return;
  }
  let html = '<table><thead><tr><th>ID</th><th>Tool</th><th>Role</th><th>Risk</th><th>Status</th></tr></thead><tbody>';
  for (const item of workItems) {
    const sel = item.approvalId === selectedId ? 'selected' : '';
    const statusClass = (item.status || '').toLowerCase();
    html += `<tr class="${sel}" onclick="selectItem('${item.approvalId}')">`;
    html += `<td style="font-family:monospace;font-size:11px;">${item.approvalId.substring(0,12)}…</td>`;
    html += `<td>${escapeHtml(item.toolName || '—')}</td>`;
    html += `<td>${escapeHtml(item.requiredRole || '—')}</td>`;
    html += `<td>${escapeHtml(item.riskLevel || '—')}</td>`;
    html += `<td><span class="status ${statusClass}">${item.status || '—'}</span></td>`;
    html += '</tr>';
  }
  html += '</tbody></table>';
  container.innerHTML = html;
}

function selectItem(id) {
  selectedId = id;
  renderList();
  const item = workItems.find(w => w.approvalId === id);
  if (!item) return;
  const detail = document.getElementById('detail-panel');
  const canApprove = item.status === 'PENDING';
  detail.innerHTML = `
    <h3>Approval Detail</h3>
    <div class="field"><span class="label">Approval ID</span><span style="font-family:monospace;font-size:11px;">${escapeHtml(item.approvalId)}</span></div>
    <div class="field"><span class="label">Workflow Run</span><span>${escapeHtml(item.workflowRunId || '—')}</span></div>
    <div class="field"><span class="label">Tool</span><span>${escapeHtml(item.toolName || '—')}</span></div>
    <div class="field"><span class="label">Status</span><span>${escapeHtml(item.status || '—')}</span></div>
    <div class="field"><span class="label">Required Role</span><span>${escapeHtml(item.requiredRole || '—')}</span></div>
    <div class="field"><span class="label">Risk Level</span><span>${escapeHtml(item.riskLevel || '—')}</span></div>
    <div class="field"><span class="label">Subject Type</span><span>${escapeHtml(item.subjectType || '—')}</span></div>
    <div class="field"><span class="label">Subject ID</span><span>${escapeHtml(item.subjectId || '—')}</span></div>
    <div class="field"><span class="label">Recommendation</span><span>${escapeHtml(item.recommendationType || '—')}</span></div>
    <div class="field"><span class="label">Requested By</span><span>${escapeHtml(item.requestedBy || '—')}</span></div>
    <div class="field"><span class="label">Requested At</span><span>${item.requestedAt ? new Date(item.requestedAt).toLocaleString() : '—'}</span></div>
    <div class="field"><span class="label">Expires At</span><span>${item.expiresAt ? new Date(item.expiresAt).toLocaleString() : '—'}</span></div>
    <div class="field"><span class="label">Continuation</span><span>${escapeHtml(item.continuationStatus || '—')}</span></div>
    <div class="field"><span class="label">Version</span><span>${item.version ?? '—'}</span></div>
    <div class="actions">
      <button class="btn-approve" onclick="actionApproval('approve')" ${!canApprove ? 'disabled' : ''}>${canApprove ? 'Approve' : 'Approved'}</button>
      <button class="btn-deny" onclick="actionApproval('deny')" ${!canApprove ? 'disabled' : ''}>${canApprove ? 'Deny' : 'Denied'}</button>
      <button class="btn-resume" onclick="actionResume()" ${item.status !== 'APPROVED' ? 'disabled' : ''}>Resume</button>
    </div>
    <div id="result-area" class="result"></div>
  `;
}

async function actionApproval(action) {
  if (!selectedId) return;
  const resultArea = document.getElementById('result-area');
  resultArea.className = 'result';
  try {
    const res = await fetch(`${BASE}/approvals/${selectedId}/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ actor: 'reviewer:local', reason: `${action === 'approve' ? 'Approved' : 'Denied'} from preview reviewer UI`, expectedVersion: 0 }),
    });
    const data = res.ok ? await res.json().catch(() => ({})) : null;
    if (res.ok) {
      resultArea.textContent = data?.status ? `${action === 'approve' ? 'Approved' : 'Denied'} — ${data.status}` : `${action === 'approve' ? 'Approved' : 'Denied'} successfully`;
      resultArea.className = 'result success';
    } else {
      const errorText = await res.text().catch(() => 'Unknown error');
      resultArea.textContent = `Failed: HTTP ${res.status} — ${errorText.substring(0,200)}`;
      resultArea.className = 'result error';
    }
    loadInbox();
  } catch (e) {
    resultArea.textContent = `Error: ${e.message}`;
    resultArea.className = 'result error';
  }
}

async function actionResume() {
  if (!selectedId) return;
  const resultArea = document.getElementById('result-area');
  resultArea.className = 'result';
  try {
    const res = await fetch(`${BASE}/approvals/${selectedId}/resume`, { method: 'POST' });
    const data = res.ok ? await res.json().catch(() => ({})) : null;
    if (res.ok) {
      resultArea.textContent = data?.result ? `Resumed — ${data.result}` : 'Resumed successfully';
      resultArea.className = 'result success';
    } else {
      const errorText = await res.text().catch(() => 'Unknown error');
      resultArea.textContent = `Failed: HTTP ${res.status} — ${errorText.substring(0,200)}`;
      resultArea.className = 'result error';
    }
    loadInbox();
  } catch (e) {
    resultArea.textContent = `Error: ${e.message}`;
    resultArea.className = 'result error';
  }
}

function escapeHtml(s) {
  if (!s) return s;
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

loadInbox();
</script>
</body>
</html>

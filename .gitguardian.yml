# GitGuardian configuration
# Whitelist false positives that are test artifacts, not real secrets.
version: 2

# Paths to entirely ignore
paths-ignore:
  - '**/.gradle/**'
  - '**/build/**'
  - '**/*.bin'
  - '**/*.lock'
  - '**/*.class'

# Content-level exclusions
content:
  # Test key files use deliberately non-secret test data
  - description: Test key file reference in application-jdbc.yml — references env var, not a secret value
    match: 'TRAMAI_JDBC_KEY_FILE'
    paths:
      - 'examples/spring-sovereign-starter/src/main/resources/application-jdbc.yml'

  # Broken DataSource used in no-fallback test — not a real credential
  - description: Test broken DataSource has dummy password, not a real secret
    match: 'broken'
    paths:
      - '**/JdbcSovereignRuntimeE2ETest.kt'
